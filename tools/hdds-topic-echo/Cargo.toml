[package]
name = "hdds-topic-echo"
version.workspace = true
edition = "2021"
description = "Echo DDS topic messages in real-time (like rostopic echo)"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["dds", "rtps", "cli", "debugging"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "hdds-topic-echo"
path = "src/main.rs"

[dependencies]
hdds = { version = "1.5.0", path = "../../crates/hdds" }
clap = { version = "4", features = ["derive"] }
colored = "2"
chrono = "0.4"
ctrlc = "3"
libc = "0.2"
