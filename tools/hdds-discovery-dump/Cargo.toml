[package]
name = "hdds-discovery-dump"
version.workspace = true
edition = "2021"
description = "Dump live DDS discovery state (participants, readers, writers)"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["dds", "rtps", "discovery", "debugging"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "hdds-discovery-dump"
path = "src/main.rs"

[dependencies]
hdds = { version = "1.5.0", path = "../../crates/hdds" }
clap = { version = "4", features = ["derive"] }
colored = "2"
ctrlc = "3"
libc = "0.2"
