[package]
name = "hdds-latency-probe"
version.workspace = true
edition = "2021"
description = "DDS latency benchmark tool with ping-pong measurements"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["dds", "rtps", "benchmark", "latency"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "hdds-latency-probe"
path = "src/main.rs"

[dependencies]
hdds = { version = "1.5.0", path = "../../crates/hdds" }
clap = { version = "4", features = ["derive"] }
colored = "2"
ctrlc = "3"
libc = "0.2"
env_logger = "0.11"
