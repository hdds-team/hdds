[package]
name = "hdds-persistence"
version.workspace = true
edition = "2021"
license.workspace = true
description = "HDDS Persistence Service - TRANSIENT/PERSISTENT durability with SQLite/RocksDB"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
hdds = { version = "1.5.0", path = "../hdds", features = ["security"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rocksdb = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"
# `hdds::test_support` (a unique domain per test) for the relay test that
# carries a mixed-representation topic through the real persistence path;
# resolver v2 keeps the feature out of the library/binary build.
hdds = { path = "../hdds", features = ["test-support"] }

[features]
default = ["sqlite"]
sqlite = []
rocksdb-backend = ["rocksdb"]

[[bin]]
name = "hdds-persistence"
path = "src/main.rs"

[lib]
name = "hdds_persistence"
path = "src/lib.rs"
