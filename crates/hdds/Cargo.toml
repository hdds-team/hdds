[package]
name = "hdds"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["xtypes", "qos-loaders", "xtypes-structural-assignability"]
rti-hexdump = []  # Enable verbose RTI packet hex dumps for debugging
telemetry = []
bench-stress = []
logging = []
trace = ["logging"]  # Trace requires logging to be enabled
xtypes = []
type-lookup = ["xtypes"]  # HDDS-only TypeLookup (feature-gated, no vendor interop)
xtypes-structural-assignability = ["xtypes"]  # Structural assignability for nested complex type refs (in defaults; opt out via default-features = false)
security = ["dep:ring", "dep:x509-parser", "dep:pem", "dep:webpki", "dep:base64", "dep:zeroize", "dep:num-bigint"]
qos-loaders = ["dep:roxmltree", "dep:serde", "dep:serde_yaml"]
lowbw-lz4 = ["dep:lz4_flex"]  # LZ4 compression for low-bandwidth transport
tcp-tls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile", "dep:zeroize"]  # TLS support for TCP transport
quic = ["dep:quinn", "dep:rustls", "dep:rustls-pemfile", "dep:rcgen", "dep:tokio"]  # QUIC transport for NAT traversal and connection migration
cloud-discovery = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio", "dep:ring", "dep:roxmltree", "dns-sd"]  # Cloud discovery backends (Consul, AWS, Azure); ring for request signing (already linked via reqwest -> rustls), roxmltree for the STS AssumeRoleWithWebIdentity XML answer (already a qos-loaders dependency); dns-sd is the DNS half of Cloud Map
dns-sd = []  # DNS-SD peer discovery over SRV + A/AAAA (zero dependencies, in-tree RFC 1035 codec)
json = ["dep:serde_json"]  # JSON projection of dynamic samples (hdds::dynamic::json), shared by the WebSocket bridge and the InfluxDB sink
k8s = []  # Kubernetes DNS-based discovery (zero dependencies, uses Headless Services)
rpc = ["dep:tokio"]  # DDS-RPC Request/Reply pattern (requires async runtime)
dialect-coredx = []
dialect-dust = []
dialect-gurum = []
dialect-intercom = []
dialect-opensplice = []
dynamic-types = []  # XTypes Dynamic Language Binding (post-v1.0)
typed-test = ["test-support"]  # Gate for typed_cross_lang_test (requires hddsgen-generated types; its wire probe decodes DATA with test_support::wire)
test-support = []  # Exposes `test_support` (UDP port reservation with retry) outside cfg(test), for this crate's own integration tests and dependent crates' test suites. Default off; never enabled by a normal build.
# Faster ring consumer gate for a reader drained by a single thread (about
# 2 ns per take on a one-thread write-then-take benchmark). The thread that first consumes a reader enters with plain
# stores and loads; the first other consumer engages the compare-and-swap for
# good through a membarrier(2) handshake. Trade-off: its correctness rests on
# the Linux kernel's membarrier contract and on compiler_fence acting as a
# compiler barrier, outside the Rust abstract memory model, and it adds one
# `unsafe` system call. Off by default: the default build keeps the plain
# compare-and-swap gate (acquire/release atomics only), the cert-friendly one.
# On non-Linux targets, under Miri, or when the kernel refuses membarrier at
# runtime, the feature falls back to the compare-and-swap regime. One-time
# cost: the first DataReader of the process registers membarrier, which
# waits for an RCU grace period (about 40 ms) at
# reader creation, never on the take path.
fast-consumer-gate = []

[dependencies]
hdds-codegen = { path = "../hdds-codegen", version = "1.5.0" }
socket2 = "0.5"
crossbeam = "0.8"
dashmap = "6"
arc-swap = "1.7"
lru = "0.18"
parking_lot = "0.12"
log = "0.4"
md-5 = "0.10"
ring = { version = "0.17", optional = true }
x509-parser = { version = "0.16", optional = true, features = ["verify"] }
# RSASSA-PSS verification for any salt length (security/handshake/pss.rs):
# ring verifies a salt of the digest length only. Already in the tree through
# x509-parser -> der-parser, so no new crate.
num-bigint = { version = "0.4", optional = true }
pem = { version = "3.0", optional = true }
webpki = { version = "0.22", optional = true }
base64 = { version = "0.22", optional = true }
zeroize = { version = "1.7", optional = true }
roxmltree = { version = "0.20", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_yaml = { version = "0.9", optional = true }
lz4_flex = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = { version = "0.26", optional = true }
rustls-pemfile = { version = "2.1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.0", optional = true, features = ["rt", "time", "sync", "macros"] }
quinn = { version = "0.11", optional = true, default-features = false, features = ["runtime-tokio", "rustls"] }
rcgen = { version = "0.13", optional = true }
libc = "0.2"
flate2 = "1.0"
mio = { version = "1.0", features = ["net", "os-poll"] }

# Interface enumeration on Windows only; every Unix uses getifaddrs(3) via libc
# (transport/ifaddrs.rs), which keeps neli/rtnetlink out of the Unix tree.
[target.'cfg(windows)'.dependencies]
local-ip-address = "0.6"
# setsockopt(SO_EXCLUSIVEADDRUSE) on the unicast ports (transport/udp.rs).
# Same version and feature socket2 0.5 already pulls in on Windows.
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
# Self dev-dependency: this crate's own tests under `tests/` build against
# the compiled lib as an external crate (no `cfg(test)`), so the
# `test-support` feature must be turned on explicitly for them to see
# `hdds::test_support`. Unit tests (`#[cfg(test)] mod tests` inside src/)
# don't need this -- `cfg(test)` already gates the module on for them.
hdds = { path = ".", features = ["test-support"] }
criterion = "0.5"
# Foreign oracle for `discovery_server::base64`: our hand-written codec is
# compared byte for byte against the reference implementation instead of
# against itself. The production side of the same protocol (the
# hdds-discovery-server binary) uses this crate, so this is also what keeps
# the two ends of the relay speaking the same language.
base64 = "0.22"
tempfile = "3.8"
fastrand = "2"
env_logger = "0.11"
# In-process test PKI for the TCP-TLS / mTLS proofs (transport/tcp/tls_test_pki.rs).
# Same crate and version as the optional `quic` dependency above: zero new lock entries.
rcgen = "0.13"
# Binary provenance for interop_smoke's --build-info (hashes its own exe):
# same version already pinned transitively (Cargo.lock has sha2 0.10.9), so
# this adds zero new lock entries too.
sha2 = "0.10"
# Audit and quality tools (binaries, not libraries - for reference only)
# cargo-audit = "0.20"
# cargo-deny = "0.15"
# cargo-tarpaulin = "0.22"

# Modern benchmarks (public API)
[[bench]]
name = "write_latency"
harness = false

[[bench]]
name = "read_latency"
harness = false

[[bench]]
name = "discovery"
harness = false

# Internal benchmarks
[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "shm_latency"
harness = false

[[bench]]
name = "reader_api"
harness = false

[[bench]]
name = "throughput"
harness = false

# Stress tests (require feature flag)
[[bench]]
name = "stress_multi_node"
harness = false
required-features = ["bench-stress"]

[[bench]]
name = "stress_phase7a"
harness = false
required-features = ["bench-stress"]

# Typed cross-language test (requires hddsgen to generate interop_types.rs first)
[[example]]
name = "typed_cross_lang_test"
required-features = ["typed-test"]

# Two rules owned by the COMPILER rather than by a reviewer's memory: dropped
# `Result`s and needless casts are refused as errors. They apply to lib,
# tests, examples and benches and cost nothing at runtime.
[lints.rust]
unused_must_use = "deny"
# cargo-fuzz builds with `--cfg fuzzing`; see control_parser::fuzz_scan_embedded_control.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Relax pedantic clippy lints for examples/tests (avoids 30-line #![allow] walls)
[lints.clippy]
unnecessary_cast = "deny"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
explicit_iter_loop = "allow"
float_cmp = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
items_after_statements = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
match_wild_err_arm = "allow"
match_wildcard_for_single_variants = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_continue = "allow"
needless_pass_by_value = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
shadow_unrelated = "allow"
similar_names = "allow"
single_match_else = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
