[package]
name = "hdds-schema-registry"
publish = false
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Schema Registry for HDDS DDS types"
repository.workspace = true
readme.workspace = true
keywords = ["dds", "schema", "registry", "xtypes"]
categories = ["network-programming"]

[features]
default = []
# HTTP REST surface plus the hdds-schema-registry binary.
server = ["dep:axum", "dep:tokio", "dep:clap"]
# Announce and receive registered schemas over DDS.
dds = ["dep:hdds"]

[[bin]]
name = "hdds-schema-registry"
path = "src/bin/hdds-schema-registry.rs"
required-features = ["server"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
axum = { version = "0.7", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", optional = true, features = ["derive"] }
hdds = { version = "1.5.0", path = "../hdds", optional = true }

[dev-dependencies]
tempfile = "3.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
