[package]
name = "hdds-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HDDS REST API Gateway with Web UI"
repository.workspace = true
readme.workspace = true
keywords = ["dds", "rest", "gateway", "admin", "monitoring"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "hdds-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# No dev-dependencies on purpose. This crate had a `reqwest` dev-dependency with
# zero references in its sources; it only pulled rustls -> ring into the test
# graph, and `cargo check --tests` builds dev-dependencies unconditionally, so it
# broke the windows-gate MSVC lane (ring's build script needs the Windows CRT).
# A future HTTP-level test should use crates/hdds/src/test_support/fake_http.rs
# rather than re-adding an HTTP client here.
